    <script>
      // The hero photograph belongs to the homepage only. Injecting the
      // preload here keeps other routes from paying for it, while still
      // letting the browser pick a viewport-sized file.
      if (location.pathname === '/' || location.pathname === '/index.html') {
        var preload = document.createElement('link')
        preload.rel = 'preload'
        preload.as = 'image'
        preload.href = '/images/hero-maldives-960.webp'
        preload.setAttribute(
          'imagesrcset',
          '/images/hero-maldives-640.webp 640w, /images/hero-maldives-960.webp 960w, /images/hero-maldives-1400.webp 1400w, /images/hero-maldives-1800.webp 1800w, /images/hero-maldives.webp 2400w',
        )
        preload.setAttribute('imagesizes', '100vw')
        preload.setAttribute('fetchpriority', 'high')
        document.head.appendChild(preload)
      }
    </script>
    <title>SOLÉRA — Where every moment feels like summer</title>
    <meta property="og:title" content="SOLÉRA — Luxury travel, considered" />
    <meta
      property="og:description"
      content="Private villas, quiet coasts and journeys shaped around the light."
